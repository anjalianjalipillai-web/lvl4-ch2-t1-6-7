<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Working with Numbers and Data Using NumPy | Young IT Germany</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#fff6df 0%,#f7ecc6 28%,#4cbf98 68%,#0b7a5a 100%) fixed;font-family:Arial,Helvetica,sans-serif;font-size:20px;color:#0e3a2c}
.logo{position:fixed;top:10px;left:12px;font-size:14px;font-weight:bold;background:#fff;border-radius:20px;padding:5px 12px;box-shadow:0 2px 6px #0004;z-index:5}
.logo b{color:#0b7a5a}.logo i{color:#d89a00;font-style:normal}.logo u{color:#e4572e;text-decoration:none}
main{max-width:900px;margin:0 auto;padding:62px 14px 40px}
.ban{background:#fff9e8;border:3px solid #0b7a5a;border-radius:18px;padding:10px 18px;margin:10px 0;color:#075c44;box-shadow:0 4px 10px #0003}
h1{font-size:38px;text-align:center;margin:0}h2{font-size:28px;margin:0}h3{margin:14px 0 6px}
.sub{text-align:center;font-size:21px;margin-top:6px;color:#0b7a5a}
.card{background:#fff;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 6px 16px #0003;line-height:1.5}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:14px}
.mc{background:#fffbef;border:5px solid #fff;border-radius:22px;padding:14px;text-align:center;cursor:pointer;font-family:inherit;font-size:20px;color:#0e3a2c;box-shadow:0 6px 14px #0003}
.mc:hover{border-color:#f2b705;transform:translateY(-3px)}.mc .e{font-size:50px;display:block}.mc.v{border-color:#0b7a5a}
.mc small{display:block;color:#0b7a5a;font-weight:bold;margin-top:4px}
.b{background:#0b7a5a;color:#fff;border:0;border-radius:14px;padding:12px 20px;font-size:20px;font-family:inherit;cursor:pointer;margin:6px 4px}
.b.o{background:#c8431e}.b.y{background:#f2b705;color:#0e3a2c}.b.w{background:#fff;color:#0b7a5a;border:3px solid #0b7a5a}
input[type=text],input[type=number]{font-size:20px;font-family:inherit;padding:10px;border:3px solid #a9dcc8;border-radius:12px;width:100%;max-width:360px}
input.cd{font-family:Consolas,monospace;max-width:100%;background:#0f2e24;color:#fff0b3;border-color:#0b7a5a}
.pill{display:inline-block;background:#f2b705;color:#0e3a2c;border-radius:20px;padding:4px 14px;font-weight:bold;font-size:16px}
.badge{display:inline-block;font-size:13px;font-weight:bold;border-radius:12px;padding:3px 10px;color:#fff;background:#0b7a5a;margin:2px 4px 2px 0}.badge.o{background:#c8431e}
.say{display:flex;gap:12px;align-items:center;background:#fff6dc;border-left:8px solid #0b7a5a;border-radius:16px;padding:12px;margin:10px 0}.say .c{font-size:54px}
.tips{background:#e8f8f0;border-left:8px solid #f2b705;border-radius:12px;padding:8px 16px;margin-top:14px;font-size:18px}.tips summary{font-weight:bold;cursor:pointer;font-size:20px}
code{background:#0f2e24;color:#fff0b3;border-radius:8px;padding:2px 8px;font-family:Consolas,monospace;font-size:18px}
pre.code{background:#0f2e24;color:#fff0b3;border-radius:12px;padding:12px;overflow-x:auto;font-size:17px;font-family:Consolas,monospace;margin:8px 0}
table.t{border-collapse:collapse;width:100%;font-size:19px;margin:10px 0}
.t th{background:#0b7a5a;color:#fff;padding:9px;text-align:left}.t td{padding:8px 9px;border-bottom:2px solid #d6efe4}
.wrap{overflow-x:auto}
.arr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.bx{min-width:64px;text-align:center}.bx b{display:block;background:#0b7a5a;color:#fff;border-radius:12px;padding:10px 6px;font-size:24px}.bx.k b{cursor:pointer}.bx.k b:hover{background:#f2b705;color:#0e3a2c}
.bx i{display:block;font-style:normal;color:#0b7a5a;font-weight:bold;font-size:14px;margin-top:3px;min-height:18px}.bx.hl b{background:#f2b705;color:#0e3a2c}
.row{margin:14px 0;padding-bottom:10px;border-bottom:2px dashed #bfe6d4}
.ok{color:#0b7a4f;font-weight:bold}.no{color:#c8431e;font-weight:bold}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.right{background:#0b7a4f}.opt.wrong{background:#c8431e}
.nav{display:flex;justify-content:space-between;flex-wrap:wrap;margin-top:10px}
.bub{border-radius:16px;padding:10px 14px;margin:8px 0}.u{background:#fff0c4}.ai{background:#dff5ea}
details.q{background:#f6fbf8;border:2px solid #bfe6d4;border-radius:12px;padding:10px 14px;margin:8px 0}details.q summary{font-weight:bold;cursor:pointer}
.hero{text-align:center;padding:24px 10px}.hero .ci{display:inline-block;border-radius:22px;overflow:hidden;box-shadow:0 8px 20px #0005;max-width:100%}
.steps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.steps span{background:#fff0b3;border-radius:30px;padding:8px 16px;font-weight:bold}
</style></head><body>
<div class="logo"><b>Young</b> <i>IT</i> <u>Germany</u></div>
<main id="app"></main>
<script>
const SALES=[12,18,15,22,9,25,19],DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const ST=[['📖','Hook & Story',5],['💡','Simple Concept',10],['🤖','Live AI Demo',10],['🎯','Student Activity',15],['💻','Build & Code',20],['🏆','Number Detective Challenge',15],['💬','Discussion',5],['📝','Quiz & Take-home Mission',10]];
const MX=[0,0,0,7,6,7,0,5];
let me={name:'',cls:''},S={},V={};
const $=id=>document.getElementById(id),app=$('app');
const sc=i=>Object.values(S[i]||{}).reduce((x,y)=>x+y,0);
const setS=(i,k,v)=>{S[i]=S[i]||{};S[i][k]=Math.max(S[i][k]||0,v)};
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const say=(c,t,id)=>`<div class="say"><div class="c">${c}</div><div ${id?`id="${id}"`:''}>${t}</div></div>`;
const tip=l=>`<details class="tips" open><summary>💡 Tips to help you</summary><ul>${l.map(x=>`<li>${x}</li>`).join('')}</ul></details>`;
const GEM=`<svg viewBox="0 0 300 160" width="420" style="max-width:100%;display:block"><rect width="300" height="160" fill="#fff3cf"/><path d="M0 130Q70 100 140 128T300 118V160H0Z" fill="#0b7a5a"/><path d="M0 146Q90 126 170 146T300 140V160H0Z" fill="#075c44"/><polygon points="215,40 245,40 262,60 230,98 198,60" fill="#18b07f"/><polygon points="198,60 262,60 230,98" fill="#0b7a5a"/><polygon points="215,40 230,60 245,40" fill="#6fe0b8"/><path d="M270 30l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#f2b705"/><ellipse cx="100" cy="112" rx="42" ry="30" fill="#3fbf6a"/><circle cx="80" cy="76" r="17" fill="#3fbf6a"/><circle cx="120" cy="76" r="17" fill="#3fbf6a"/><circle cx="80" cy="76" r="11" fill="#fff"/><circle cx="120" cy="76" r="11" fill="#fff"/><circle cx="82" cy="77" r="5" fill="#0e3a2c"/><circle cx="118" cy="77" r="5" fill="#0e3a2c"/><path d="M82 112q18 14 36 0" stroke="#0e3a2c" stroke-width="3" fill="none" stroke-linecap="round"/><text x="22" y="40" font-size="22" font-weight="bold" fill="#0b7a5a" font-family="Arial">12</text><text x="150" y="30" font-size="26" font-weight="bold" fill="#c8431e" font-family="Arial">25</text><text x="168" y="86" font-size="20" font-weight="bold" fill="#f2b705" font-family="Arial">7</text></svg>`;
const boxes=(a,o={})=>`<div class="arr">${a.map((v,i)=>`<div class="bx ${o.click?'k':''} ${(o.hl||[]).includes(i)?'hl':''}"><b ${o.click?`onclick="${o.click}(${i})"`:''}>${v}</b><i>${o.lab?o.lab(i):'index '+i}</i></div>`).join('')}</div>`;
function page(i,h){V[i]=1;app.innerHTML=`<span class="pill">⏱ ${ST[i][2]} min</span><div class="ban"><h2>${ST[i][0]} Stage ${i+1}: ${ST[i][1]}</h2></div>${h}<div class="nav"><button class="b w" onclick="home()">⬅ Menu</button>${i<7?`<button class="b" onclick="go(${i+1})">Next Stage ➡</button>`:`<button class="b o" onclick="results()">See My Results 🏆</button>`}</div>`;window.scrollTo(0,0)}
const go=i=>[s1,s2,s3,s4,s5,s6,s7,s8][i]();

function splash(){app.innerHTML=`<div class="hero"><div class="ci">${GEM}</div><div class="ban" style="margin-top:20px"><h1>Working with Numbers and Data Using NumPy</h1><div class="sub">The Emerald Number Adventure</div></div><button class="b o" onclick="reg()">Begin 🚀</button></div>`}
function reg(){app.innerHTML=`<div class="card" style="text-align:center">${say('🐸','Hello, Number Explorer! I am Zippy the Frog. Tell me your name and class to begin.')}<p><input type="text" id="nm" placeholder="Your name" maxlength="40"></p><p><input type="text" id="cl" placeholder="Your class (e.g. Class 6)" maxlength="20"></p><p id="er" class="no"></p><button class="b" onclick="enter()">Enter Activities 🎮</button></div>`}
function enter(){const n=$('nm').value.trim(),c=$('cl').value.trim();if(!n||!c){$('er').textContent='Please type your name and class first 🙂';return}me={name:n,cls:c};home()}
function home(){app.innerHTML=`<div class="ban"><h1 style="font-size:32px">Welcome, ${esc(me.name)}! 🐸</h1><div class="sub">Pick any stage. Follow the order or explore freely!</div></div><div class="menu">${ST.map((s,i)=>`<button class="mc ${V[i]?'v':''}" onclick="go(${i})"><span class="e">${s[0]}</span><b>${i+1}. ${s[1]}</b><small>⏱ ${s[2]} min ${V[i]?'✅':''}</small></button>`).join('')}<button class="mc" onclick="results()" style="border-color:#f2b705"><span class="e">🏅</span><b>My Results</b><small>See &amp; download</small></button></div>`}

let hi=0,hs=0;
function s1(){hi=0;hs=0;page(0,`<div class="card">${say('🐸','Hi! I am <b>Zippy</b>, and I run the Emerald Fruit Stall. Here is how many fruits I sold each day this week. I need the <b>total</b>... but adding by hand takes so long! 😩')}
${boxes(SALES,{lab:i=>DAYS[i]})}
<button class="b y" onclick="hand()">🐢 Add by hand (tap for each day)</button><button class="b" onclick="fast()">⚡ Ask NumPy</button><div id="hh"><p>Which is faster? Try both!</p></div>
${tip(['Tap the turtle button again and again. Count how many taps you need!','Then tap the NumPy button. How many taps now?'])}</div>`)}
function hand(){if(hi>=7)return;hs+=SALES[hi];hi++;$('hh').innerHTML=`<p>🐢 Added ${hi} of 7 days... running total: <b>${hs}</b></p>`+(hi===7?'<p>Finally! Total = <b>120</b>. That took 7 steps!</p>':'')}
function fast(){$('hh').innerHTML='<pre class="code">np.sum(sales)\n120</pre><p>⚡ NumPy did all 7 additions in a blink! Imagine 1000 days!</p>'}

let ma=[];
function s2(){ma=SALES.slice();page(1,`<div class="card"><p><b>NumPy</b> 🔢 is a Python tool that works with numbers super fast. A row of numbers inside NumPy is called an <b>array</b>.</p><pre class="code">import numpy as np
sales = np.array([12, 18, 15, 22, 9, 25, 19])</pre>
<h3>🧩 Array boxes</h3><p>Tap a box to see its code. <b>Counting starts at 0!</b></p>${boxes(SALES,{click:'tapb'})}${say('🐸','Tap any box!','m2')}
<h3>⚡ Super power: maths on ALL numbers at once</h3><button class="b y" onclick="mop(0)">× 2</button><button class="b y" onclick="mop(1)">+ 5</button><button class="b w" onclick="mop(2)">Reset</button><div id="mb"></div><p id="mc"></p>
<h3>🪄 Magic words</h3><div class="wrap"><table class="t"><tr><th>Code</th><th>What it does</th></tr><tr><td><code>np.array([...])</code></td><td>Makes an array</td></tr><tr><td><code>sales[0]</code></td><td>Gets the number at index 0</td></tr><tr><td><code>np.sum</code> <code>np.max</code> <code>np.min</code> <code>np.mean</code></td><td>Total, biggest, smallest, average</td></tr><tr><td><code>sales * 2</code></td><td>Doubles every number</td></tr><tr><td><code>sales[sales &gt; 15]</code></td><td>Keeps only numbers bigger than 15</td></tr></table></div>
${tip(['<b>Array</b> = a row of numbers in one box.','<b>Index</b> = the position of a number. The first one is index <b>0</b>.','NumPy can do maths on the <b>whole array</b> in one step!'])}</div>`);mb()}
const NT=['first','second','third','fourth','fifth','sixth','seventh'];
function tapb(i){$('m2').innerHTML=`<code>sales[${i}]</code> is <b>${SALES[i]}</b>. It is the ${NT[i]} number, but its index is ${i}!`}
function mb(){$('mb').innerHTML=boxes(ma,{lab:i=>DAYS[i]})}
function mop(k){if(k===2){ma=SALES.slice();$('mc').textContent='Back to the start!'}else{ma=ma.map(v=>k?v+5:v*2);$('mc').innerHTML=k?'Code: <code>sales + 5</code> added 5 to <b>every</b> number!':'Code: <code>sales * 2</code> doubled <b>every</b> number!'}mb()}

const DEMO=[{p:'Write NumPy code to find which day had the most sales.',c:'np.argmax(sales)',o:'5  → index 5 is Saturday (25 fruits)'},
{p:'Each fruit costs ₹2. Write code for the money earned each day.',c:'sales * 2',o:'[24 36 30 44 18 50 38]'},
{p:'Show only the days when more than 15 fruits were sold.',c:'sales[sales > 15]',o:'[18 22 25 19]'}];
function s3(){page(2,`<div class="card"><span class="badge">🇪🇺 AI Literacy</span><span class="badge o">Human Oversight</span>
${say('🤖','I am the AI helper! Teacher, pick a question and ask me live. Students, check if I am right!')}
${DEMO.map((d,i)=>`<button class="b ${['','y','o'][i]}" onclick="demo(${i})">Ask AI #${i+1}</button>`).join('')}<div id="dm"></div>
${tip(['AI writes code very fast, but it can make mistakes.','Check the output yourself. Is Saturday really the biggest (25)?','A clear question gets better code. Say what you want and name the array.'])}</div>`)}
function demo(i){const d=DEMO[i];$('dm').innerHTML=`<div class="bub u">🧒 <b>You:</b> ${d.p}</div><div class="bub ai">🤖 <b>AI:</b> Here is the code:<pre class="code">${esc(d.c)}</pre><b>Output:</b><br>${esc(d.o)}</div>${say('🐸','<b>Check the AI:</b> Look at the array. Is the answer correct? How do you know?')}`}

const IH=[['Tap the box that is <code>sales[3]</code>',3],['Tap the box that is <code>sales[0]</code>',0],['Tap the box that is <code>sales[6]</code>',6],['Which box holds the number <b>25</b>? Tap it!',5]];let ih=0,ms=[];
function s4(){ih=0;ms=SALES.slice();page(3,`<div class="card"><h3>🔎 Part A: Index Hunt</h3><div id="ihb"></div>
<h3>⚙️ Part B: The Number Machine</h3><p>Press the buttons and watch the whole array change. Then answer.</p><button class="b y" onclick="mach(0)">× 2</button><button class="b y" onclick="mach(1)">+ 5</button><button class="b y" onclick="mach(2)">+ 1</button><button class="b w" onclick="mach(3)">Reset</button><div id="mm"></div>
<div class="row">1. Press Reset, then × 2. What is the <b>first</b> number?<br><input type="number" id="m1"> <span id="m1r"></span></div>
<div class="row">2. Press Reset, then + 5. What is the <b>last</b> number?<br><input type="number" id="m2"> <span id="m2r"></span></div>
<div class="row">3. Press Reset, then × 2, then + 1. What is the <b>second</b> number?<br><input type="number" id="m3"> <span id="m3r"></span></div>
<button class="b" onclick="c4()">Check ✅</button>
${tip(['Index Hunt: the boxes have <b>no labels</b>. Count from 0: 0, 1, 2, 3...','Machine: every button changes <b>all</b> the numbers.','Press Reset before each question so you start from the original numbers.'])}</div>`);dh();mm()}
function dh(){if(ih>=4){$('ihb').innerHTML=say('🐸','🎉 Index master! You can find any number!');return}$('ihb').innerHTML=`<p class="prog"><b>Round ${ih+1} of 4:</b> ${IH[ih][0]}</p>${boxes(SALES,{click:'hh4',lab:()=>'&nbsp;'})}<p id="hf"></p>`}
function hh4(i){if(i===IH[ih][1]){setS(3,'h'+ih,1);ih++;dh()}else $('hf').innerHTML='<span class="no">❌ Not that box. Count from 0!</span>'}
function mm(){$('mm').innerHTML=boxes(ms,{lab:i=>DAYS[i]})}
function mach(k){ms=k===3?SALES.slice():ms.map(v=>k===0?v*2:k===1?v+5:v+1);mm()}
function c4(){[['m1',24],['m2',24],['m3',37]].forEach(a=>{const e=$(a[0]),ok=e.value!==''&&+e.value===a[1];$(a[0]+'r').innerHTML=ok?'<span class="ok">✅ Yes!</span>':'<span class="no">❌ Try again</span>';if(ok)setS(3,a[0],1)})}

const E=[{p:'Find the <b>total</b> of all the sales.',h:'Use <code>np.sum(sales)</code> or <code>sales.sum()</code>',re:/^(np\.sum\(sales\)|sales\.sum\(\))$/,o:'120'},
{p:'Find the <b>highest</b> sales number.',h:'Try <code>np.max(...)</code> and put sales inside the brackets.',re:/^(np\.max\(sales\)|sales\.max\(\))$/,o:'25'},
{p:'Find the <b>average</b> of the sales.',h:'Mean is the maths word for average: <code>np.mean(...)</code>',re:/^(np\.mean\(sales\)|sales\.mean\(\))$/,o:'17.142857142857142'},
{p:'Show the <b>first</b> number (index 0).',h:'Square brackets pick a position: <code>sales[ ]</code>. Which index is first?',re:/^sales\[0\]$/,o:'12'},
{p:'<b>Double</b> every number.',h:'Use the star * to multiply: <code>sales * ...</code>',re:/^(sales\*2|2\*sales)$/,o:'[24 36 30 44 18 50 38]'},
{p:'⭐ Show only the days with <b>more than 15</b> sales.',h:'Put a test inside the brackets: <code>sales[ sales ... 15 ]</code>',re:/^sales\[sales>(15|=16)\]$/,o:'[18 22 25 19]'}];
function s5(){page(4,`<div class="card">${say('🐸','Time to write real code! Zippy\'s sales are stored in <code>sales</code>.')}
<pre class="code">import numpy as np
sales = np.array([12, 18, 15, 22, 9, 25, 19])</pre>
${E.map((e,i)=>`<div class="row"><b>${i+1}.</b> ${e.p}<br><input type="text" class="cd" id="e${i}" placeholder="type your code here" autocomplete="off" spellcheck="false"><br><button class="b o" onclick="run(${i})">▶ Run</button><button class="b w" onclick="hint(${i})">💡 Hint</button><div id="eo${i}"></div></div>`).join('')}
${tip(['Python is picky: <code>sales</code> is not <code>Sales</code>.','Round brackets <code>( )</code> run actions. Square brackets <code>[ ]</code> pick positions.','Stuck? Tap 💡 Hint. Look back at the Magic Words in Stage 2!'])}</div>`)}
const norm=v=>{v=v.replace(/\s+/g,'').replace(/"/g,"'");if(v.startsWith('print(')&&v.endsWith(')'))v=v.slice(6,-1);return v};
function run(i){const ok=E[i].re.test(norm($('e'+i).value));$('eo'+i).innerHTML=ok?`<div class="bub ai"><span class="ok">✅ Great code!</span> Output:<br>${esc(E[i].o)}</div>`:'<div class="bub u"><span class="no">❌ Not quite.</span> Check spelling and brackets, or tap Hint.</div>';if(ok)setS(4,'e'+i,1)}
function hint(i){$('eo'+i).innerHTML=`<div class="bub u">💡 ${E[i].h}</div>`}

const PT=[40,55,30,70,65];
const CQ=[['q1','1. What is the <b>highest</b> number?','n',70],['q2','2. What is the <b>lowest</b> number?','n',30],['q3','3. What is the <b>total</b> of all numbers?','n',260],['q4','4. What is the <b>average</b>?','n',52],['q5','5. What is <code>points[3]</code>?','n',70],['q6','⭐ Super 1: Every friend gets 10 bonus points. What is the <b>new total</b>?','n',310],['q7','⭐ Super 2: Type the code that adds 10 to every number in <code>points</code>.','t',/^(points\+10|10\+points)$/]];
function s6(){page(5,`<div class="card">${say('🐸','Five friends hunted for emeralds in the garden. Here are their points!')}<pre class="code">points = np.array([40, 55, 30, 70, 65])</pre>${boxes(PT)}
${CQ.map(q=>`<div class="row"><b>${q[1]}</b><br>${q[2]==='n'?`<input type="number" id="${q[0]}" placeholder="?">`:`<input type="text" class="cd" id="${q[0]}" placeholder="type your code" autocomplete="off" spellcheck="false">`} <span id="${q[0]}r"></span></div>`).join('')}
<button class="b" onclick="c6()">Check my answers ✅</button>
${tip(['Highest = biggest number. Lowest = smallest number.','Total: add them up in pairs. 40 + 55 = 95, then keep adding.','Average = total ÷ 5, because there are 5 friends.','Index starts at 0, so <code>points[3]</code> is the <b>fourth</b> box.','Super 1: 5 friends × 10 bonus points = 50 more points.','Super 2: think about <code>sales * 2</code> from Stage 2.'])}</div>`)}
function c6(){CQ.forEach(q=>{const e=$(q[0]);const ok=q[2]==='n'?e.value!==''&&+e.value===q[3]:q[3].test(norm(e.value));$(q[0]+'r').innerHTML=ok?'<span class="ok">✅ Correct!</span>':'<span class="no">❌ Try again</span>';if(ok)setS(5,q[0],1)})}

function s7(){page(6,`<div class="card"><span class="badge o">🇪🇺 Data Privacy (GDPR)</span><span class="badge">Human Oversight</span>${say('🐸','Let us talk! Tap each question, discuss with a friend, then open the talking points.')}
${[['Why is NumPy faster than adding by hand?','The computer does the same job on all numbers at once, without getting tired or making slips.'],['What other numbers could we put in an array?','Marks, steps walked, rainfall, pocket money, goals scored... Share your own ideas!'],['AI gave us code. Why should we still check it?','AI can make mistakes. People check the answer. This is called human oversight.'],['Is it okay to share real marks or personal numbers online?','Personal data must be protected. Ask permission first, or use made-up numbers when practising.']].map(d=>`<details class="q"><summary>💬 ${d[0]}</summary><p>${d[1]}</p></details>`).join('')}
${tip(['Take turns speaking. Listen to your friends.','Use words like "array", "index", "sum" and "average".'])}</div>`)}
